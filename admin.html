<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPD - Report Admin</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/off-duty-report/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/off-duty-report/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/off-duty-report/favicon-16x16.png">
  <link rel="manifest" href="/off-duty-report/site.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Report Admin">
  <meta name="theme-color" content="#1e3a5f">
  <style>
    :root{
      --ink:#1a1d21;
      --paper:#ffffff;
      --line:#c9cdd3;
      --line-strong:#1a1d21;
      --muted:#6b7280;
      --accent:#1e3a5f;
      --accent-soft:#eef2f7;
    }
    *{box-sizing:border-box;}
    body{
      font-family:'Helvetica Neue',Arial,sans-serif;
      color:var(--ink);
      background:#f4f5f7;
      margin:0;
      padding:0;
    }

    /* ===== BUTTONS ===== */
    button{
      font-family:inherit;
      font-size:13px;
      font-weight:600;
      border-radius:7px;
      border:1px solid transparent;
      padding:9px 14px;
      cursor:pointer;
      transition:filter .12s ease, transform .05s ease;
    }
    button:active{transform:translateY(1px);}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{filter:brightness(1.1);}
    .btn-secondary{background:var(--accent-soft);color:var(--accent);border-color:#d7e0ea;}
    .btn-secondary:hover{filter:brightness(0.97);}

    /* ===== PIN MODAL ===== */
    .modal-overlay{
      position:fixed;inset:0;
      background:rgba(0,0,0,.45);
      display:flex;align-items:center;justify-content:center;
      z-index:1000;
    }
    .modal-overlay.hidden{display:none;}
    .modal-content{
      background:var(--paper);
      border-radius:12px;
      box-shadow:0 8px 32px rgba(0,0,0,.18);
      padding:32px;
      position:relative;
    }
    .pin-modal{
      max-width:360px;width:90%;
      text-align:center;
    }
    .pin-modal h2{
      margin:0 0 8px;
      font-size:20px;
      color:var(--accent);
    }
    .pin-modal p{
      margin:0 0 16px;
      font-size:14px;
      color:var(--muted);
    }
    .pin-modal input{
      width:100%;
      font-size:24px;
      text-align:center;
      letter-spacing:.3em;
      padding:12px;
      border:2px solid var(--line);
      border-radius:8px;
      outline:none;
      font-family:inherit;
      margin-bottom:12px;
    }
    .pin-modal input:focus{border-color:var(--accent);}
    .pin-error{
      color:#b3261e;
      font-size:13px;
      margin-bottom:12px;
    }
    .pin-error.hidden{display:none;}

    /* ===== ADMIN HEADER ===== */
    .admin-header{
      max-width:1100px;
      margin:0 auto;
      padding:24px 20px 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:12px;
    }
    .admin-header h1{
      margin:0;
      font-size:22px;
      color:var(--accent);
    }
    .admin-header-right{
      display:flex;
      gap:8px;
      align-items:center;
    }

    /* ===== FILTER BAR ===== */
    .filter-bar{
      max-width:1100px;
      margin:20px auto 0;
      padding:0 20px;
      display:flex;
      align-items:flex-end;
      gap:16px;
      flex-wrap:wrap;
    }
    .filter-group{
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .filter-group label{
      font-size:11px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:var(--muted);
    }
    .filter-group select{
      padding:8px 12px;
      border:1px solid var(--line);
      border-radius:6px;
      font-size:13px;
      font-family:inherit;
      background:var(--paper);
      color:var(--ink);
      min-width:140px;
      outline:none;
    }
    .filter-group select:focus{border-color:var(--accent);}
    .result-count{
      font-size:13px;
      color:var(--muted);
      padding-bottom:8px;
    }

    /* ===== TABLE ===== */
    .table-container{
      max-width:1100px;
      margin:16px auto 40px;
      padding:0 20px;
      overflow-x:auto;
    }
    .admin-table{
      width:100%;
      border-collapse:collapse;
      background:var(--paper);
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    .admin-table thead th{
      background:var(--accent-soft);
      color:var(--accent);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.03em;
      padding:12px 14px;
      text-align:left;
      border-bottom:2px solid var(--line);
      font-weight:700;
      white-space:nowrap;
    }
    .admin-table tbody td{
      padding:10px 14px;
      border-bottom:1px solid var(--line);
      font-size:13px;
      vertical-align:middle;
    }
    .admin-table tbody tr:hover{background:#fafbfc;}
    .admin-table tbody tr:last-child td{border-bottom:none;}
    .btn-view{
      background:var(--accent-soft);
      color:var(--accent);
      border:1px solid #d7e0ea;
      font-size:12px;
      padding:5px 10px;
      border-radius:5px;
    }
    .btn-view:hover{filter:brightness(0.95);}
    .btn-delete{
      background:#fff;
      color:#b3261e;
      border:1px solid #f2c9c6;
      font-size:12px;
      padding:5px 10px;
      border-radius:5px;
    }
    .btn-delete:hover{background:#fdf1f0;}

    .empty-state{
      text-align:center;
      padding:60px 20px;
      color:var(--muted);
      font-size:15px;
    }
    .empty-state.hidden{display:none;}

    .loading{
      text-align:center;
      padding:60px 20px;
      color:var(--muted);
      font-size:15px;
    }
    .loading.hidden{display:none;}

    .sig-badge{
      display:inline-block;
      width:10px;height:10px;
      border-radius:50%;
      margin-left:4px;
      vertical-align:middle;
    }
    .sig-badge.yes{background:#1a7a3d;}
    .sig-badge.no{background:#d7e0ea;}

    /* ===== DETAIL MODAL ===== */
    .detail-modal{
      max-width:900px;
      width:95%;
      max-height:88vh;
      display:flex;
      flex-direction:column;
    }
    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      padding-bottom:12px;
      margin-bottom:16px;
      flex-shrink:0;
    }
    .modal-header h2{
      margin:0;
      font-size:18px;
      color:var(--accent);
    }
    .modal-close{
      background:transparent;
      border:none;
      font-size:24px;
      color:var(--muted);
      cursor:pointer;
      padding:4px 8px;
      line-height:1;
    }
    .modal-close:hover{color:var(--ink);}
    .modal-body{
      overflow-y:auto;
      flex:1;
      padding-right:4px;
    }

    .detail-header-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      border:1px solid var(--line-strong);
      border-radius:6px;
      overflow:hidden;
      margin-bottom:20px;
    }
    .detail-cell{
      padding:8px 12px;
      border-bottom:1px solid var(--line-strong);
      font-size:13px;
    }
    .detail-cell:nth-child(odd){border-right:1px solid var(--line-strong);}
    .detail-cell:nth-last-child(-n+2){border-bottom:none;}
    .detail-cell strong{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.02em;}

    .detail-page-title{
      font-size:14px;
      font-weight:700;
      color:var(--accent);
      margin:20px 0 8px;
    }
    .detail-table{
      width:100%;
      border-collapse:collapse;
      margin-bottom:4px;
    }
    .detail-table thead th{
      background:var(--accent-soft);
      color:var(--accent);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.03em;
      padding:7px 8px;
      border:1px solid var(--line);
      font-weight:700;
      text-align:left;
    }
    .detail-table tbody td{
      padding:5px 8px;
      border:1px solid var(--line);
      font-size:12px;
    }
    .detail-sigs{
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
      margin:12px 0 8px;
    }
    .detail-sig-block{
      border:1px solid var(--line);
      border-radius:6px;
      padding:8px 10px;
    }
    .detail-sig-block label{
      display:block;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:var(--muted);
      margin-bottom:6px;
    }
    .detail-sig-block img{
      max-width:100%;
      height:auto;
      max-height:80px;
      display:block;
    }
    .detail-sig-block .not-signed{
      font-size:12px;
      color:var(--muted);
      font-style:italic;
      padding:10px 0;
    }

    /* ===== PRINT / EXPORT STYLES ===== */
    @page{size: letter; margin: 0.3in;}
    .print-sheet{
      font-family:'Helvetica Neue',Arial,sans-serif;
      color:var(--ink);
      max-width:900px;
      margin:0 auto 28px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:10px;
      padding:36px 40px 28px;
      page-break-inside:avoid;
    }
    .print-sheet-header{
      display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 20px;
    }
    .print-logo-badge{height:125px;max-width:125px;}
    .print-logo-patch{height:100px;max-width:100px;}
    .print-sheet h1{
      flex:1;text-align:center;font-size:22px;letter-spacing:.01em;margin:0;
    }
    .print-sheet h1 .cont{font-weight:400;color:var(--muted);font-size:16px;}
    .print-info-grid{
      display:grid;grid-template-columns:1fr 1fr;
      border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;margin-bottom:16px;
    }
    .print-info-cell{
      border-bottom:1px solid var(--line-strong);padding:8px 10px;font-size:13px;
    }
    .print-info-cell:nth-child(odd){border-right:1px solid var(--line-strong);}
    .print-info-cell:nth-last-child(-n+2){border-bottom:none;}
    .print-info-cell label{font-size:12px;color:var(--muted);margin-right:6px;}
    .print-table{width:100%;border-collapse:collapse;margin-bottom:4px;}
    .print-table thead th{
      background:#eef2f7;border:1px solid var(--line-strong);padding:7px 6px;
      font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);font-weight:700;text-align:left;
    }
    .print-table tbody td{border:1px solid var(--line);padding:4px 6px;font-size:12px;}
    .print-total-row{
      display:flex;justify-content:flex-end;align-items:center;gap:10px;
      border:1px solid var(--line-strong);border-top:none;padding:6px 12px;
      font-size:13px;font-weight:700;background:#eef2f7;
    }
    .print-sigs{
      display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px;
    }
    .print-sig-block{border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;}
    .print-sig-block label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:6px;}
    .print-sig-block img{max-width:100%;height:auto;max-height:80px;display:block;}
    .print-sig-block .not-signed{font-size:12px;color:var(--muted);font-style:italic;padding:10px 0;}
    #printContainer{display:none;}

    @media print {
      body{background:#fff;}
      body *{visibility:hidden;height:0;overflow:hidden;}
      #printContainer, #printContainer *{visibility:visible;height:auto;overflow:visible;}
      #printContainer{
        display:block;position:absolute;left:0;top:0;width:100%;
      }
      .print-sheet{
        box-shadow:none;border:none;border-radius:0;margin:0 auto;
        padding:10px 16px 8px;page-break-inside:avoid;
      }
      .print-sheet:not(:last-child){page-break-after:always;}
      .print-logo-badge{height:80px;max-width:80px;}
      .print-logo-patch{height:64px;max-width:64px;}
      .print-sheet h1{font-size:15px;margin:0;}
      .print-sheet-header{margin-bottom:8px;}
      .print-info-grid{margin-bottom:8px;}
      .print-info-cell{padding:4px 8px;font-size:11px;}
      .print-table thead th{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .print-total-row{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .print-table tbody td{padding:2px 5px;font-size:10px;}
      .print-sigs{margin-top:8px;gap:10px;}
      .print-sig-block img{max-height:44px;}
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width:640px){
      .admin-header{flex-direction:column;align-items:flex-start;}
      .filter-bar{flex-direction:column;align-items:stretch;}
      .filter-group select{min-width:0;}
      .detail-header-grid{grid-template-columns:1fr;}
      .detail-cell:nth-child(odd){border-right:none;}
      .detail-sigs{grid-template-columns:1fr;}
      .modal-content{padding:20px;}
    }
  </style>
</head>
<body>

  <!-- ===== LOGIN MODAL ===== -->
  <div class="modal-overlay" id="pinModal">
    <div class="modal-content pin-modal">
      <h2>&#128274; Admin Access</h2>
      <p>Enter your name and PIN:</p>
      <input type="text" id="adminNameInput" placeholder="Name"
             autocomplete="off" style="margin-bottom:12px;letter-spacing:normal;font-size:16px;text-align:center;">
      <input type="password" id="pinInput" maxlength="4" placeholder="****"
             inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <div class="pin-error hidden" id="pinError">Incorrect name or PIN. Try again.</div>
      <button class="btn-primary" id="pinSubmit" style="width:100%;">Enter</button>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="hidden" id="mainContent">

    <div class="admin-header">
      <h1>PAPD - Report Submissions</h1>
      <div class="admin-header-right">
        <button class="btn-primary" id="refreshBtn">&#8635; Refresh Data</button>
        <button class="btn-secondary" id="auditBtn">&#128203; Audit Log</button>
        <a href="index.html" class="btn-secondary" style="text-decoration:none;display:inline-block;">Back to Form</a>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <label>Officer</label>
        <select id="filterOfficer"><option value="">All Officers</option></select>
      </div>
      <div class="filter-group">
        <label>Month</label>
        <select id="filterMonth"><option value="">All Months</option></select>
      </div>
      <div class="filter-group">
        <label>Year</label>
        <select id="filterYear"><option value="">All Years</option></select>
      </div>
      <span class="result-count" id="resultCount"></span>
    </div>

    <div class="table-container">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Officer</th>
            <th>Rank</th>
            <th>Division</th>
            <th>Month</th>
            <th>Year</th>
            <th>Entries</th>
            <th>Hours</th>
            <th>Sig</th>
            <th>Submitted</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="reportTableBody"></tbody>
      </table>
    </div>

    <div class="empty-state hidden" id="emptyState">No submissions found.</div>
    <div class="loading hidden" id="loadingIndicator">Loading data...</div>

  </div>

  <!-- ===== DETAIL MODAL ===== -->
  <div class="modal-overlay hidden" id="detailModal">
    <div class="modal-content detail-modal">
      <div class="modal-header">
        <h2>Report Detail</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn-primary" id="exportBtn">&#128196; Export</button>
          <button class="modal-close" id="detailClose">&times;</button>
        </div>
      </div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <!-- ===== AUDIT LOG MODAL ===== -->
  <div class="modal-overlay hidden" id="auditModal">
    <div class="modal-content detail-modal">
      <div class="modal-header">
        <h2>Audit Log</h2>
        <button class="modal-close" id="auditClose">&times;</button>
      </div>
      <div class="modal-body" id="auditBody"></div>
    </div>
  </div>

  <!-- ===== PRINT/EXPORT CONTAINER (hidden on screen, shown when printing) ===== -->
  <div id="printContainer"> </div>

<script>
// ============================================================
//  CONFIGURATION
// ============================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxvEqvSE2CAdUlkP3EFQhuGpR3bWHXmt7VM-w-aE48m-BN2yBLTxQ6z7nH7cTmtM-6/exec';
const ADMIN_SECRET = 'a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c9'; // Must match SECRET_KEY in Code.gs

let allReports = [];
let currentAdmin = ''; // Set after successful login
let currentDetailReport = null; // Holds the loaded report for export
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ============================================================
//  LOGIN VERIFICATION (server-side, audit logged)
// ============================================================
async function verifyLogin() {
  const nameInput = document.getElementById('adminNameInput');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');
  const submitBtn = document.getElementById('pinSubmit');

  if (!nameInput.value.trim()) {
    pinError.textContent = 'Please enter your name.';
    pinError.classList.remove('hidden');
    nameInput.focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Checking...';

  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'login',
        adminName: nameInput.value.trim(),
        pin: pinInput.value
      })
    });

    if (!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();

    if (result.success) {
      currentAdmin = result.adminName;
      pinError.classList.add('hidden');
      document.getElementById('pinModal').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      fetchData();
    } else {
      pinError.textContent = 'Incorrect name or PIN. Try again.';
      pinError.classList.remove('hidden');
      pinInput.value = '';
      pinInput.focus();
    }
  } catch (err) {
    pinError.textContent = 'Login failed: ' + err.message;
    pinError.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enter';
  }
}

document.getElementById('pinSubmit').addEventListener('click', verifyLogin);
document.getElementById('pinInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') verifyLogin();
});
document.getElementById('adminNameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('pinInput').focus();
});
// Focus name input on load
document.getElementById('adminNameInput').focus();

// ============================================================
//  DATA FETCHING
// ============================================================
async function fetchData() {
  document.getElementById('loadingIndicator').classList.remove('hidden');
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('reportTableBody').innerHTML = '';

  try {
    const response = await fetch(APPS_SCRIPT_URL);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    allReports = Array.isArray(data) ? data : [];
    populateFilters(allReports);
    renderTable(allReports);
  } catch (err) {
    document.getElementById('emptyState').textContent = 'Failed to load data: ' + err.message;
    document.getElementById('emptyState').classList.remove('hidden');
  } finally {
    document.getElementById('loadingIndicator').classList.add('hidden');
  }
}

// ============================================================
//  FILTERS
// ============================================================
function populateFilters(data) {
  const officers = [...new Set(data.map(r => r.officer).filter(Boolean))].sort();
  const months = [...new Set(data.map(r => r.month).filter(Boolean))];
  // Sort months in calendar order
  months.sort((a, b) => MONTHS.indexOf(a) - MONTHS.indexOf(b));
  const years = [...new Set(data.map(r => r.year).filter(Boolean))].sort().reverse();

  populateSelect('filterOfficer', officers, 'All Officers');
  populateSelect('filterMonth', months, 'All Months');
  populateSelect('filterYear', years, 'All Years');
}

function populateSelect(id, values, allLabel) {
  const sel = document.getElementById(id);
  const current = sel.value;
  sel.innerHTML = '<option value="">' + allLabel + '</option>';
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function getFilteredReports() {
  const officer = document.getElementById('filterOfficer').value;
  const month = document.getElementById('filterMonth').value;
  const year = document.getElementById('filterYear').value;

  return allReports.filter(r => {
    if (officer && r.officer !== officer) return false;
    if (month && r.month !== month) return false;
    if (year && String(r.year) !== String(year)) return false;
    return true;
  });
}

// ============================================================
//  TABLE RENDERING
// ============================================================
function renderTable(data) {
  const filtered = getFilteredReports();
  const tbody = document.getElementById('reportTableBody');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('resultCount');

  tbody.innerHTML = '';

  if (filtered.length === 0) {
    empty.textContent = data.length === 0 ? 'No submissions found.' : 'No results match your filters.';
    empty.classList.remove('hidden');
    count.textContent = '';
    return;
  }

  empty.classList.add('hidden');
  count.textContent = 'Showing ' + filtered.length + ' of ' + allReports.length + ' reports';

  filtered.forEach(r => {
    const tr = document.createElement('tr');
    const submitted = r.submissionTimestamp ? formatDate(r.submissionTimestamp) : '—';

    tr.innerHTML =
      '<td><strong>' + escHtml(r.officer) + '</strong></td>' +
      '<td>' + escHtml(r.rank) + '</td>' +
      '<td>' + escHtml(r.division) + '</td>' +
      '<td>' + escHtml(r.month) + '</td>' +
      '<td>' + escHtml(r.year) + '</td>' +
      '<td>' + r.entryCount + '</td>' +
      '<td><strong>' + formatHours(r.totalHours) + '</strong></td>' +
      '<td>' +
        '<span class="sig-badge ' + (r.hasOfficerSig ? 'yes' : 'no') + '" title="Officer signature"></span>' +
      '</td>' +
      '<td>' + submitted + '</td>' +
      '<td style="white-space:nowrap;">' +
        '<button class="btn-view" data-id="' + escHtml(r.reportId) + '">View</button> ' +
        '<button class="btn-delete" data-id="' + escHtml(r.reportId) + '">Delete</button>' +
      '</td>';

    tbody.appendChild(tr);
  });

  // Attach view handlers
  tbody.querySelectorAll('.btn-view').forEach(btn => {
    btn.addEventListener('click', () => showDetail(btn.dataset.id));
  });

  // Attach delete handlers
  tbody.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => deleteReport(btn.dataset.id));
  });
}

// ============================================================
//  DETAIL VIEW
// ============================================================
async function showDetail(reportId) {
  const modal = document.getElementById('detailModal');
  const body = document.getElementById('detailBody');
  body.innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px;">Loading report details...</p>';
  modal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  // Log the view (fire-and-forget — never block the detail on this)
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'view',
      reportId: reportId,
      adminName: currentAdmin,
      secretKey: ADMIN_SECRET
    })
  }).catch(() => {});

  try {
    const response = await fetch(APPS_SCRIPT_URL + '?reportId=' + encodeURIComponent(reportId));
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const report = await response.json();

    if (!report || !report.header) {
      body.innerHTML = '<p style="color:#b3261e;">Report not found.</p>';
      currentDetailReport = null;
      return;
    }

    currentDetailReport = report;
    renderDetailBody(report);
  } catch (err) {
    body.innerHTML = '<p style="color:#b3261e;">Failed to load report: ' + escHtml(err.message) + '</p>';
  }
}

function renderDetailBody(report) {
  const body = document.getElementById('detailBody');
  const h = report.header;

  let html = '';
  // Header info
  html += '<div class="detail-header-grid">';
  html += '<div class="detail-cell"><strong>Officer</strong><br>' + escHtml(h.officer) + '</div>';
  html += '<div class="detail-cell"><strong>Rank</strong><br>' + escHtml(h.rank) + '</div>';
  html += '<div class="detail-cell"><strong>Division</strong><br>' + escHtml(h.division) + '</div>';
  html += '<div class="detail-cell"><strong>Month / Year</strong><br>' + escHtml(h.month) + ' ' + escHtml(h.year) + '</div>';
  html += '</div>';

  html += '<p style="font-size:12px;color:var(--muted);margin:0 0 8px;">Submitted: ' +
    (h.submissionTimestamp ? formatDate(h.submissionTimestamp) : '—') +
    ' &middot; ' + report.entryCount + ' entries &middot; Total: <strong>' + formatHours(report.totalHours) + '</strong> hrs' +
    ' &middot; Report ID: ' + escHtml(report.reportId) + '</p>';

  // Pages
  if (report.pages && report.pages.length > 0) {
    report.pages.forEach(page => {
      html += '<div class="detail-page-title">Page ' + page.page + '</div>';
      html += '<table class="detail-table"><thead><tr>';
      html += '<th>Date</th><th>Day</th><th>Employer</th><th>Vehicle</th><th>Type</th><th>Start</th><th>End</th><th>Hours</th>';
      html += '</tr></thead><tbody>';

      let pageTotal = 0;
      (page.entries || []).forEach(entry => {
        const h = parseFloat(entry.hours);
        if (!isNaN(h)) pageTotal += h;
        html += '<tr>';
        html += '<td>' + escHtml(entry.dateWorked) + '</td>';
        html += '<td>' + escHtml(entry.day) + '</td>';
        html += '<td>' + escHtml(entry.employer) + '</td>';
        html += '<td>' + escHtml(entry.vehicle) + '</td>';
        html += '<td>' + escHtml(entry.type) + '</td>';
        html += '<td>' + formatTime(entry.start) + '</td>';
        html += '<td>' + formatTime(entry.end) + '</td>';
        html += '<td>' + escHtml(entry.hours) + '</td>';
        html += '</tr>';
      });

      html += '</tbody></table>';
      html += '<div style="display:flex;justify-content:flex-end;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px;">' +
        'Page total: ' + formatHours(pageTotal) + ' hrs</div>';

      // Signatures
      html += '<div class="detail-sigs">';
      html += '<div class="detail-sig-block"><label>Officer Signature</label>';
      if (page.sigOfficer && page.sigOfficer.length > 10) {
        html += '<img src="' + escHtml(page.sigOfficer) + '" alt="Officer signature">';
      } else {
        html += '<div class="not-signed">(Not signed)</div>';
      }
      html += '</div>';
      html += '</div>';
    });
  }

  body.innerHTML = html;
}

// ============================================================
//  EXPORT / PRINT REPORT DETAIL
//  Builds a print-ready replica of the report (with the PAPD
//  logo images) like the index.html sheets, then triggers print.
// ============================================================
function buildPrintView(report) {
  const h = report.header;
  const container = document.getElementById('printContainer');
  let html = '';

  // Each page becomes its own "sheet" in the print output
  (report.pages || []).forEach(page => {
    html += '<div class="print-sheet">';
    html += '<div class="print-sheet-header">';
    html += '<img class="print-logo-badge" src="badge.png" alt="" onerror="this.style.visibility=\'hidden\'">';
    html += '<h1>PAPD - Off-Duty Employment Report<span class="cont"></span></h1>';
    html += '<img class="print-logo-patch" src="patch.png" alt="" onerror="this.style.visibility=\'hidden\'">';
    html += '</div>';

    html += '<div class="print-info-grid">';
    html += '<div class="print-info-cell"><label>Officer:</label>' + escHtml(h.officer) + '</div>';
    html += '<div class="print-info-cell"><label>Rank:</label>' + escHtml(h.rank) + '</div>';
    html += '<div class="print-info-cell"><label>Division:</label>' + escHtml(h.division) + '</div>';
    html += '<div class="print-info-cell"><label>Month / Year:</label>' + escHtml(h.month) + ' ' + escHtml(h.year) + '</div>';
    html += '</div>';

    html += '<table class="print-table"><thead><tr>';
    html += '<th>Date Worked</th><th>Day</th><th>Employer</th><th>Vehicle</th><th>Type</th><th>Start</th><th>End</th><th>Hours</th>';
    html += '</tr></thead><tbody>';

    (page.entries || []).forEach(entry => {
      html += '<tr>';
      html += '<td>' + escHtml(entry.dateWorked) + '</td>';
      html += '<td>' + escHtml(entry.day) + '</td>';
      html += '<td>' + escHtml(entry.employer) + '</td>';
      html += '<td>' + escHtml(entry.vehicle) + '</td>';
      html += '<td>' + escHtml(entry.type) + '</td>';
      html += '<td>' + formatTime(entry.start) + '</td>';
      html += '<td>' + formatTime(entry.end) + '</td>';
      html += '<td>' + escHtml(entry.hours) + '</td>';
      html += '</tr>';
    });

    html += '</tbody></table>';
    html += '<div class="print-total-row"><span>Page Total:</span><span class="val">' +
      formatHours(pageTotal(report, page)) + '</span><span>hrs</span></div>';

    html += '<div class="print-sigs">';
    html += '<div class="print-sig-block"><label>Officer Signature</label>';
    if (page.sigOfficer && page.sigOfficer.length > 10) {
      html += '<img src="' + escHtml(page.sigOfficer) + '" alt="Officer signature">';
    } else {
      html += '<div class="not-signed">(Not signed)</div>';
    }
    html += '</div>';
    html += '</div>';

    html += '</div>'; // .print-sheet
  });

  // Grand total line appended as a final summary sheet
  html += '<div class="print-sheet" style="text-align:center;">';
  html += '<div style="font-size:14px;font-weight:700;color:var(--accent);padding:12px;">';
  html += 'Grand Total (all pages): ' + formatHours(report.totalHours) + ' hours';
  html += '</div></div>';

  container.innerHTML = html;
}

// Sum hours for entries belonging to a given page
function pageTotal(report, page) {
  let total = 0;
  (page.entries || []).forEach(entry => {
    const h = parseFloat(entry.hours);
    if (!isNaN(h)) total += h;
  });
  return total;
}

function exportDetail() {
  if (!currentDetailReport) {
    alert('No report loaded to export.');
    return;
  }
  buildPrintView(currentDetailReport);
  // Add a body class so only the print container is visible when printing
  window.print();
}
async function deleteReport(reportId) {
  const confirmed = confirm('Delete this report?\n\nThis will permanently remove all of its entries from the Google Sheet. This action cannot be undone.');
  if (!confirmed) return;

  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'delete',
        reportId: reportId,
        adminName: currentAdmin,
        secretKey: ADMIN_SECRET
      })
    });

    if (!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();

    if (result.success) {
      // Close detail modal if open for this report
      const detailModal = document.getElementById('detailModal');
      if (!detailModal.classList.contains('hidden')) {
        detailModal.classList.add('hidden');
        document.body.style.overflow = '';
      }
      alert('Report deleted successfully.');
      fetchData(); // Refresh the table
    } else {
      throw new Error(result.error || 'Delete failed');
    }
  } catch (err) {
    alert('Failed to delete report: ' + err.message);
  }
}

async function openAuditLog() {
  const modal = document.getElementById('auditModal');
  const body = document.getElementById('auditBody');
  body.innerHTML = '<p style="text-align:center;color:var(--muted);padding:40px;">Loading audit log...</p>';
  modal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'get_audit',
        adminName: currentAdmin,
        secretKey: ADMIN_SECRET
      })
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const entries = await response.json();

    if (!entries || entries.length === 0) {
      body.innerHTML = '<div class="empty-state">No audit entries yet.</div>';
      return;
    }

    renderAuditLog(entries);
  } catch (err) {
    body.innerHTML = '<p style="color:#b3261e;text-align:center;padding:40px;">Failed to load audit log: ' + escHtml(err.message) + '</p>';
  }
}

function renderAuditLog(entries) {
  const body = document.getElementById('auditBody');
  let html = '<table class="detail-table"><thead><tr>';
  html += '<th>Time</th><th>Admin</th><th>Action</th><th>Detail</th>';
  html += '</tr></thead><tbody>';

  entries.forEach(entry => {
    const action = entry.action || '';
    let actionLabel = action;
    if (action === 'login') actionLabel = '&#128273; Login';
    else if (action === 'login_failed') actionLabel = '&#9888;&#65039; Failed login';
    else if (action === 'delete') actionLabel = '&#128465;&#65039; Delete';
    else if (action === 'view') actionLabel = '&#128065; View';

    html += '<tr>';
    html += '<td>' + formatDate(entry.timestamp) + '</td>';
    html += '<td><strong>' + escHtml(entry.adminName) + '</strong></td>';
    html += '<td>' + actionLabel + '</td>';
    html += '<td>' + escHtml(entry.detail) + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  body.innerHTML = html;
}

// ============================================================
//  HELPERS
// ============================================================
function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatDate(iso) {
  try {
    return new Date(iso).toLocaleString();
  } catch (e) {
    return String(iso);
  }
}

function formatHours(h) {
  const n = parseFloat(h);
  if (isNaN(n)) return '0.00';
  return n.toFixed(2);
}

function formatTime(minutesStr) {
  if (!minutesStr) return '';
  const m = parseInt(minutesStr, 10);
  if (isNaN(m)) return minutesStr;
  const h24 = Math.floor(m / 60);
  const min = m % 60;
  const ampm = h24 < 12 ? 'AM' : 'PM';
  let h12 = h24 % 12;
  if (h12 === 0) h12 = 12;
  return h12 + ':' + String(min).padStart(2, '0') + ' ' + ampm;
}
