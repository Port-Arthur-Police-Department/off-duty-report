<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secondary Employment Report</title>
  <style>
    :root{
      --ink:#1a1d21;
      --paper:#ffffff;
      --line:#c9cdd3;
      --line-strong:#1a1d21;
      --muted:#6b7280;
      --accent:#1e3a5f;
      --accent-soft:#eef2f7;
    }
    *{box-sizing:border-box;}
    body{
      font-family:'Helvetica Neue',Arial,sans-serif;
      color:var(--ink);
      background:#f4f5f7;
      margin:0;
      padding:24px 12px 80px;
    }
    .toolbar{
      max-width:900px;
      margin:0 auto 20px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px 16px;
    }
    .toolbar-title{
      font-size:13px;
      font-weight:600;
      color:var(--muted);
      letter-spacing:.02em;
      text-transform:uppercase;
    }
    .btn-group{display:flex;gap:8px;flex-wrap:wrap;}
    button{
      font-family:inherit;
      font-size:13px;
      font-weight:600;
      border-radius:7px;
      border:1px solid transparent;
      padding:9px 14px;
      cursor:pointer;
      transition:filter .12s ease, transform .05s ease;
    }
    button:active{transform:translateY(1px);}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{filter:brightness(1.1);}
    .btn-secondary{background:var(--accent-soft);color:var(--accent);border-color:#d7e0ea;}
    .btn-secondary:hover{filter:brightness(0.97);}
    .btn-danger{background:#fff;color:#b3261e;border-color:#f2c9c6;}
    .btn-danger:hover{background:#fdf1f0;}

    .sheet{
      max-width:900px;
      margin:0 auto 28px;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:10px;
      padding:36px 40px 28px;
      position:relative;
    }
    .sheet .page-tag{
      position:absolute;
      top:14px;
      right:18px;
      font-size:11px;
      color:var(--muted);
    }
    h1{
      text-align:center;
      font-size:22px;
      letter-spacing:.01em;
      margin:0 0 20px;
    }
    h1 .cont{font-weight:400;color:var(--muted);font-size:16px;}

    .info-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      border:1px solid var(--line-strong);
      border-radius:6px;
      overflow:hidden;
      margin-bottom:22px;
    }
    .info-cell{
      border-bottom:1px solid var(--line-strong);
      padding:8px 10px;
      display:flex;
      align-items:center;
      gap:6px;
      position:relative;
    }
    .info-cell:nth-child(odd){border-right:1px solid var(--line-strong);}
    .info-cell:nth-last-child(-n+2){border-bottom:none;}
    .info-cell label{font-size:12px;color:var(--muted);white-space:nowrap;}
    .info-cell input{
      border:none;
      border-bottom:1px solid var(--line);
      outline:none;
      font-size:13px;
      padding:3px 2px;
      flex:1;
      background:transparent;
      font-family:inherit;
    }
    .info-cell input:focus{border-bottom-color:var(--accent);}
    .info-cell select.info-select{
      border:none;
      border-bottom:1px solid var(--line);
      outline:none;
      font-size:13px;
      padding:3px 2px;
      flex:1;
      background:transparent;
      font-family:inherit;
      color:var(--ink);
      cursor:pointer;
      min-width:0;
    }
    .info-cell select.info-select:focus{border-bottom-color:var(--accent);}
    .info-cell select.info-select-month{flex:1.4;}
    .info-cell select.info-select-year{flex:0.8;}

    table{
      width:100%;
      border-collapse:collapse;
      margin-bottom:4px;
    }
    thead th{
      border:1px solid var(--line-strong);
      background:var(--accent-soft);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:var(--accent);
      padding:8px 6px;
      font-weight:700;
    }
    tbody td{
      border:1px solid var(--line);
      padding:0;
      height:30px;
      position:relative;
    }
    tbody td input{
      width:100%;
      height:100%;
      border:none;
      outline:none;
      font-size:12.5px;
      padding:0 6px;
      font-family:inherit;
      background:transparent;
    }
    tbody td input.day-input {
      text-align: center;
    }
    tbody td select.type-select{
      width:100%;
      height:100%;
      border:none;
      outline:none;
      font-size:12.5px;
      padding:0 4px;
      font-family:inherit;
      background:transparent;
      color:var(--ink);
      cursor:pointer;
    }
    tbody td select.type-select:focus{background:#fbfcfe;}
    tbody td select.type-select option.placeholder{color:var(--muted);}
    .date-cell{
      position:relative;
      display:flex;
      align-items:center;
      height:100%;
    }
    input.date-display{
      width:100%;
      height:100%;
      border:none;
      outline:none;
      font-size:12.5px;
      padding:0 24px 0 6px;
      font-family:inherit;
      background:transparent;
      color:var(--ink);
      pointer-events:none;
    }
    input.date-display::placeholder{color:var(--muted);}
    input.date-native{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      margin:0;
      padding:0 24px 0 6px;
      border:none;
      background:transparent;
      opacity:0;
      cursor:pointer;
      z-index:2;
      font-size:12.5px;
      font-family:inherit;
      color-scheme:light;
    }
    .date-icon{
      position:absolute;
      right:4px;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:none;
      padding:0;
      font-size:12px;
      color:var(--muted);
      line-height:1;
      pointer-events:none;
      z-index:1;
    }
    tbody td input:focus{background:#fbfcfe;}
    tbody tr:hover td{background:#fafbfc;}
    .row-del{
      width:26px;
      text-align:center;
      color:var(--muted);
      cursor:pointer;
      font-size:13px;
      border:1px solid var(--line);
      background:#fff;
    }
    .row-del:hover{color:#b3261e;}
    col.c-date{width:10%;}
    col.c-day{width:10%;}
    col.c-emp{width:22%;}
    col.c-type{width:16%;}
    col.c-time{width:26%;}
    col.c-hrs{width:10%;}
    col.c-del{width:26px;}

    .time-cell{
      display:flex;
      align-items:center;
      gap:4px;
      padding:0 4px;
      height:100%;
    }
    .time-cell select{
      flex:1;
      min-width:0;
      border:none;
      outline:none;
      font-size:11.5px;
      font-family:inherit;
      background:transparent;
      padding:4px 2px;
      color:var(--ink);
      height:100%;
    }
    .time-cell select:invalid,
    .time-cell select.placeholder{color:var(--muted);}
    .time-sep{color:var(--muted);font-size:11px;flex-shrink:0;}
    input.hrs-input{
      background:var(--accent-soft) !important;
      color:var(--accent);
      font-weight:700;
      text-align:center;
      cursor:default;
    }

    .table-actions{
      display:flex;
      justify-content:flex-end;
      margin:6px 0 0;
    }
    .table-actions button{font-size:12px;padding:6px 10px;}

    .total-row{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      border:1px solid var(--line-strong);
      border-top:none;
      padding:8px 12px;
      font-size:13px;
      font-weight:700;
      background:var(--accent-soft);
    }
    .total-row span.val{
      min-width:60px;
      text-align:right;
      color:var(--accent);
    }

    .sig-section{
      margin-top:24px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }
    .sig-block{
      border:1px solid var(--line-strong);
      border-radius:6px;
      padding:10px 12px 12px;
    }
    .sig-block label{
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.03em;
    }
    .sig-pad-wrap{
      border:1px dashed var(--line);
      border-radius:5px;
      margin-top:6px;
      background:#fcfcfd;
    }
    canvas.sig-pad{
      width:100%;
      height:90px;
      display:block;
      touch-action:none;
      cursor:crosshair;
    }
    .sig-controls{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:6px;
    }
    .sig-controls small{color:var(--muted);font-size:10.5px;}
    .sig-controls button{
      font-size:11px;
      padding:4px 8px;
      background:transparent;
      border:1px solid var(--line);
      color:var(--muted);
    }

    @media print{
      body{background:#fff;padding:0;}
      .toolbar{display:none;}
      .sheet{
        box-shadow:none;
        border:none;
        border-radius:0;
        margin:0 auto;
        page-break-after:always;
        padding:24px 30px;
      }
      .row-del,.table-actions,.sig-controls button{display:none;}
      .time-cell select{appearance:none;-webkit-appearance:none;background:transparent;}
      thead th{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      .total-row{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    }

    @media (max-width:640px){
      .sheet{padding:20px 16px;}
      .info-grid{grid-template-columns:1fr;}
      .info-cell:nth-child(odd){border-right:none;}
      .sig-section{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title">Secondary Employment Report — Digital</div>
  <div class="btn-group">
    <button class="btn-secondary" id="addPageBtn">+ Add Page (25 rows)</button>
    <button class="btn-secondary" id="printBtn">Print</button>
    <button class="btn-primary" id="exportBtn">Export as PDF</button>
    <button class="btn-secondary" id="saveBtn">💾 Save Progress</button>
    <button class="btn-secondary" id="loadBtn">📂 Load Progress</button>
    <button class="btn-danger" id="clearBtn">🗑️ Clear All</button>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none">
</div>

<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const ROWS_PER_PAGE = 25;
const pagesEl = document.getElementById('pages');
let pageCount = 0;
const sigPads = {};

function timeOptionsHTML(){
  let html = '<option value="" class="placeholder">--:--</option>';
  for(let m=0; m<24*60; m+=15){
    const h24 = Math.floor(m/60);
    const min = m%60;
    const ampm = h24 < 12 ? 'AM' : 'PM';
    let h12 = h24 % 12; if(h12===0) h12 = 12;
    const label = `${h12}:${String(min).padStart(2,'0')} ${ampm}`;
    html += `<option value="${m}">${label}</option>`;
  }
  return html;
}
const TIME_OPTIONS_HTML = timeOptionsHTML();

function yearOptionsHTML(){
  const current = new Date().getFullYear();
  let html = '<option value="">Year...</option>';
  for(let y = current - 2; y <= current + 2; y++){
    const selected = y === current ? ' selected' : '';
    html += `<option value="${y}"${selected}>${y}</option>`;
  }
  return html;
}

function computeHours(tr){
  const startSel = tr.querySelector('.time-start');
  const endSel = tr.querySelector('.time-end');
  const hrsInput = tr.querySelector('.hrs-input');
  const s = startSel.value, e = endSel.value;
  if(s === '' || e === ''){
    hrsInput.value = '';
  } else {
    let diff = parseInt(e) - parseInt(s);
    if(diff <= 0) diff += 24*60;
    hrsInput.value = (diff/60).toFixed(2);
  }
  updateTotal(tr.closest('.sheet'));
}

function formatDateShort(iso){
  const [y, m, d] = iso.split('-').map(Number);
  const yy = String(y % 100).padStart(2,'0');
  return `${m}/${d}/${yy}`;
}

function makeRow(){
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="date-cell">
      <input type="text" class="date-display" placeholder="--/--/--" readonly tabindex="-1">
      <button type="button" class="date-icon" tabindex="-1">&#128197;</button>
      <input type="date" class="date-native" aria-label="Date worked">
    </td>
    <td><input type="text" class="day-input" placeholder="--" readonly tabindex="-1"></td>
    <td><input type="text" class="employer-input" placeholder=""></td>
    <td>
      <select class="type-select">
        <option value="" class="placeholder">Select...</option>
        <option value="Traffic">Traffic</option>
        <option value="Security">Security</option>
        <option value="Other">Other</option>
      </select>
    </td>
    <td class="time-cell">
      <select class="time-start">${TIME_OPTIONS_HTML}</select>
      <span class="time-sep">–</span>
      <select class="time-end">${TIME_OPTIONS_HTML}</select>
    </td>
    <td><input type="text" class="hrs-input" placeholder="" readonly tabindex="-1"></td>
    <td class="row-del" title="Clear row">✕</td>
  `;

  const dateDisplay = tr.querySelector('.date-display');
  const dateNative = tr.querySelector('.date-native');
  const dayInput = tr.querySelector('.day-input');

  dateNative.addEventListener('change', ()=>{
    if (dateNative.value) {
      dateDisplay.value = formatDateShort(dateNative.value);
      const dateObj = new Date(dateNative.value + 'T00:00:00');
      dayInput.value = dateObj.toLocaleDateString('en-US', { weekday: 'short' });
    } else {
      dateDisplay.value = '';
      dayInput.value = '';
    }
  });

  tr.querySelector('.row-del').addEventListener('click', ()=>{
    tr.querySelectorAll('input').forEach(i=>i.value='');
    tr.querySelectorAll('select').forEach(s=>s.value='');
    const sheet = tr.closest('.sheet');
    updateTotal(sheet);
  });
  tr.querySelector('.time-start').addEventListener('change', ()=> computeHours(tr));
  tr.querySelector('.time-end').addEventListener('change', ()=> computeHours(tr));
  return tr;
}

function updateTotal(sheet){
  const grand = document.querySelectorAll('.hrs-input');
  let allSum = 0;
  grand.forEach(i=>{ const v=parseFloat(i.value); if(!isNaN(v)) allSum+=v; });
  document.querySelectorAll('.grand-total-val').forEach(el=> el.textContent = allSum.toFixed(2));
}

function initSigPad(canvas){
  function resize(){
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    canvas.getContext('2d').scale(ratio, ratio);
  }
  resize();
  const pad = new SignaturePad(canvas, {backgroundColor:'rgba(255,255,255,0)', penColor:'#1a1d21'});
  window.addEventListener('resize', ()=>{ const data = pad.toData(); resize(); pad.fromData(data); });
  return pad;
}

function addPage(){
  pageCount++;
  const pid = pageCount;
  const isFirst = pid === 1;

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.dataset.page = pid;

  sheet.innerHTML = `
    <div class="page-tag">Page ${pid}</div>
    <h1>Secondary Employment Report ${isFirst ? '' : '<span class="cont">(Continued)</span>'}</h1>
    ${isFirst ? `
    <div class="info-grid">
      <div class="info-cell"><label>Officer:</label><input type="text"></div>
      <div class="info-cell">
        <label>Rank:</label>
        <select class="info-select">
          <option value="">Select...</option>
          <option value="Officer">Officer</option>
          <option value="Sergeant">Sergeant</option>
          <option value="Lieutenant">Lieutenant</option>
          <option value="Deputy Chief">Deputy Chief</option>
          <option value="Chief">Chief</option>
        </select>
      </div>
      <div class="info-cell">
        <label>Division:</label>
        <select class="info-select">
          <option value="">Select...</option>
          <option value="Field Operations">Field Operations</option>
          <option value="Criminal Investigations">Criminal Investigations</option>
          <option value="Administration">Administration</option>
        </select>
      </div>
      <div class="info-cell">
        <label>Month / Year:</label>
        <select class="info-select info-select-month">
          <option value="">Month...</option>
          <option value="January">January</option>
          <option value="February">February</option>
          <option value="March">March</option>
          <option value="April">April</option>
          <option value="May">May</option>
          <option value="June">June</option>
          <option value="July">July</option>
          <option value="August">August</option>
          <option value="September">September</option>
          <option value="October">October</option>
          <option value="November">November</option>
          <option value="December">December</option>
        </select>
        <select class="info-select info-select-year">${yearOptionsHTML()}</select>
      </div>
    </div>` : ''}
    <table>
      <colgroup>
        <col class="c-date"><col class="c-day"><col class="c-emp"><col class="c-type"><col class="c-time"><col class="c-hrs"><col class="c-del">
      </colgroup>
      <thead>
        <tr>
          <th>Date Worked</th><th>Day of Week</th><th>Employer</th><th>Type of Work</th><th>Time Worked</th><th>Hours</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="total-row">
      <span>Running Total (all pages):</span>
      <span class="val grand-total-val">0.00</span>
      <span>hrs</span>
    </div>
    ${pid > 1 ? `<div class="table-actions" style="justify-content:flex-start;margin-top:14px;">
        <button class="btn-danger remove-page-btn">Remove this page</button>
      </div>` : ''}
    <div class="sig-section">
      <div class="sig-block">
        <label>Officer Signature</label>
        <div class="sig-pad-wrap"><canvas class="sig-pad" id="sig-officer-${pid}"></canvas></div>
        <div class="sig-controls">
          <small>Sign with mouse or touch</small>
          <button class="clear-sig-btn" data-target="sig-officer-${pid}">Clear</button>
        </div>
      </div>
      <div class="sig-block">
        <label>Unit / Watch Commander Signature</label>
        <div class="sig-pad-wrap"><canvas class="sig-pad" id="sig-commander-${pid}"></canvas></div>
        <div class="sig-controls">
          <small>Sign with mouse or touch</small>
          <button class="clear-sig-btn" data-target="sig-commander-${pid}">Clear</button>
        </div>
      </div>
    </div>
  `;

  pagesEl.appendChild(sheet);

  const tbody = sheet.querySelector('tbody');
  for(let i=0;i<ROWS_PER_PAGE;i++) tbody.appendChild(makeRow());

  const removeBtn = sheet.querySelector('.remove-page-btn');
  if(removeBtn){
    removeBtn.addEventListener('click', ()=>{
      delete sigPads[`sig-officer-${pid}`];
      delete sigPads[`sig-commander-${pid}`];
      sheet.remove();
      renumberPages();
      updateTotal(sheet);
    });
  }

  sheet.querySelectorAll('canvas.sig-pad').forEach(canvas=>{
    const pad = initSigPad(canvas);
    sigPads[canvas.id] = pad;
  });

  sheet.querySelectorAll('.clear-sig-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = sigPads[btn.dataset.target];
      if(p) p.clear();
    });
  });

  updateTotal(sheet);
}

function renumberPages(){
  const sheets = [...document.querySelectorAll('.sheet')];
  sheets.forEach((s, idx)=>{
    s.dataset.page = idx+1;
    s.querySelector('.page-tag').textContent = `Page ${idx+1}`;
  });
}

// ============================================
//  STATE COLLECTION / APPLICATION
// ============================================

function collectPageData(sheet) {
  const rows = [];
  sheet.querySelectorAll('tbody tr').forEach(tr => {
    const dateNative = tr.querySelector('.date-native');
    const dayInput = tr.querySelector('.day-input');
    const employerInput = tr.querySelector('.employer-input');
    const type = tr.querySelector('.type-select').value;
    const start = tr.querySelector('.time-start').value;
    const end = tr.querySelector('.time-end').value;
    rows.push({
      date: dateNative.value,
      day: dayInput.value,
      employer: employerInput.value,
      type: type,
      start: start || '',
      end: end || ''
    });
  });

  const pageId = sheet.dataset.page;
  const sigOfficer = sigPads[`sig-officer-${pageId}`]?.toDataURL() || '';
  const sigCommander = sigPads[`sig-commander-${pageId}`]?.toDataURL() || '';

  return { rows, sigOfficer, sigCommander };
}

function collectHeaderData() {
  const firstSheet = document.querySelector('.sheet');
  if (!firstSheet) return {};
  const infoCells = firstSheet.querySelectorAll('.info-cell');
  
  const officer = infoCells[0]?.querySelector('input')?.value || '';
  const rank = infoCells[1]?.querySelector('select')?.value || '';
  const division = infoCells[2]?.querySelector('select')?.value || '';
  const month = infoCells[3]?.querySelector('.info-select-month')?.value || '';
  const year = infoCells[3]?.querySelector('.info-select-year')?.value || '';
  
  return { officer, rank, division, month, year };
}

function getFullState() {
  const sheets = document.querySelectorAll('.sheet');
  const pages = [];
  sheets.forEach(sheet => pages.push(collectPageData(sheet)));
  const header = collectHeaderData();
  return { header, pages };
}

const STORAGE_KEY = 'employmentForm';

function saveToLocalStorage(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* ignore */ }
}

function loadFromLocalStorage() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function applyState(state) {
  document.querySelectorAll('.sheet').forEach(el => el.remove());
  pageCount = 0;
  for (const key in sigPads) delete sigPads[key];

  state.pages.forEach((pageData, idx) => {
    restorePageFromData(pageData, idx);
  });

  const firstSheet = document.querySelector('.sheet');
  if (firstSheet && state.header) {
    const h = state.header;
    const infoCells = firstSheet.querySelectorAll('.info-cell');
    
    if (infoCells.length >= 4) {
      const officerInput = infoCells[0]?.querySelector('input');
      if (officerInput) officerInput.value = h.officer || '';
      
      const rankSelect = infoCells[1]?.querySelector('select');
      if (rankSelect) rankSelect.value = h.rank || '';
      
      const divisionSelect = infoCells[2]?.querySelector('select');
      if (divisionSelect) divisionSelect.value = h.division || '';
      
      const monthSelect = infoCells[3]?.querySelector('.info-select-month');
      const yearSelect = infoCells[3]?.querySelector('.info-select-year');
      if (monthSelect) monthSelect.value = h.month || '';
      if (yearSelect) yearSelect.value = h.year || '';
    }
  }

  document.querySelectorAll('.sheet').forEach(sheet => updateTotal(sheet));
  saveToLocalStorage(state);
}

function restorePageFromData(pageData, pageIndex) {
  addPage();
  const sheets = document.querySelectorAll('.sheet');
  const sheet = sheets[pageIndex];
  if (!sheet) return;

  const tbody = sheet.querySelector('tbody');
  const rows = tbody.querySelectorAll('tr');

  pageData.rows.forEach((rowData, i) => {
    if (i >= rows.length) return;
    const tr = rows[i];
    const dateNative = tr.querySelector('.date-native');
    const dateDisplay = tr.querySelector('.date-display');
    const dayInput = tr.querySelector('.day-input');
    const employerInput = tr.querySelector('.employer-input');
    const type = tr.querySelector('.type-select');
    const start = tr.querySelector('.time-start');
    const end = tr.querySelector('.time-end');

    if (rowData.date) {
      dateNative.value = rowData.date;
      dateDisplay.value = formatDateShort(rowData.date);
      dayInput.value = rowData.day || '';
    }
    employerInput.value = rowData.employer || '';
    type.value = rowData.type || '';
    start.value = rowData.start || '';
    end.value = rowData.end || '';
    computeHours(tr);
  });

  const pid = sheet.dataset.page;
  const officerPad = sigPads[`sig-officer-${pid}`];
  const commanderPad = sigPads[`sig-commander-${pid}`];
  if (officerPad && pageData.sigOfficer) {
    try { officerPad.fromDataURL(pageData.sigOfficer); } catch(e) {}
  }
  if (commanderPad && pageData.sigCommander) {
    try { commanderPad.fromDataURL(pageData.sigCommander); } catch(e) {}
  }
}

function exportStateToFile() {
  const state = getFullState();
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `EmploymentReport_Backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importStateFromFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const state = JSON.parse(e.target.result);
      if (!state.header || !state.pages || !Array.isArray(state.pages)) {
        throw new Error('Invalid file structure.');
      }
      applyState(state);
      alert('✅ File imported successfully!');
    } catch (err) {
      alert('❌ Failed to import file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function clearAll() {
  if (!confirm('⚠️ This will delete ALL data. Are you sure?')) return;
  
  document.querySelectorAll('.sheet').forEach(el => el.remove());
  pageCount = 0;
  for (const key in sigPads) delete sigPads[key];
  
  addPage();
  localStorage.removeItem(STORAGE_KEY);
  alert('✅ All data cleared.');
}

function attachAutoSave() {
  document.addEventListener('input', (e) => {
    if (e.target.closest('.sheet')) {
      const state = getFullState();
      saveToLocalStorage(state);
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.closest('.sheet')) {
      const state = getFullState();
      saveToLocalStorage(state);
    }
  });
  window.addEventListener('beforeunload', () => {
    const state = getFullState();
    saveToLocalStorage(state);
  });
}

function createPDFOverlay(element) {
  const parent = element.parentElement;
  const parentRect = parent.getBoundingClientRect();
  const rect = element.getBoundingClientRect();
  
  // Get computed styles
  const cs = window.getComputedStyle(element);
  
  // Create overlay div
  const overlay = document.createElement('div');
  
  // Set text based on element type
  if (element.tagName === 'SELECT') {
    const selectedIndex = element.selectedIndex;
    overlay.textContent = selectedIndex >= 0 ? element.options[selectedIndex].text : '';
    overlay.style.color = element.value === '' ? '#6b7280' : '#1a1d21';
  } else {
    overlay.textContent = element.value || '';
    overlay.style.color = '#1a1d21';
  }
  
  // Calculate position relative to parent
  const left = rect.left - parentRect.left;
  const top = rect.top - parentRect.top;
  
  // Position overlay exactly over the element using absolute positioning
  overlay.style.cssText = `
    position: absolute;
    left: ${left}px;
    top: ${top}px;
    width: ${rect.width}px;
    height: ${rect.height}px;
    display: flex;
    align-items: center;
    padding: ${cs.padding};
    font-family: ${cs.fontFamily};
    font-size: ${cs.fontSize};
    font-weight: ${cs.fontWeight};
    color: ${overlay.style.color || '#1a1d21'};
    background: transparent;
    pointer-events: none;
    z-index: 1000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-sizing: border-box;
  `;
  
  // Special handling for different element types
  if (element.closest('.time-cell')) {
    overlay.style.padding = '4px 2px';
  }
  
  if (element.classList.contains('date-display')) {
    overlay.style.paddingRight = '24px';
  }
  
  if (element.classList.contains('hrs-input') || element.classList.contains('day-input')) {
    overlay.style.justifyContent = 'center';
  }
  
  if (element.classList.contains('type-select')) {
    overlay.style.width = '100%';
    overlay.style.padding = '0 4px';
  }
  
  // For header fields in info-grid
  if (element.closest('.info-cell')) {
    // Adjust padding to match header style
    overlay.style.padding = '3px 2px';
    overlay.style.borderBottom = '1px solid #c9cdd3';
    overlay.style.borderRadius = '0';
    overlay.style.backgroundColor = 'transparent';
    overlay.style.fontSize = '13px';
    
    // For Month/Year selects, preserve flex ratios
    if (element.classList.contains('info-select-month')) {
      overlay.style.width = (rect.width * 1.4) + 'px';
      overlay.style.flex = '1.4';
    }
    if (element.classList.contains('info-select-year')) {
      overlay.style.width = (rect.width * 0.8) + 'px';
      overlay.style.flex = '0.8';
    }
    
    // For the Officer input
    if (element.tagName === 'INPUT' && !element.classList.contains('date-display')) {
      overlay.style.borderBottom = '1px solid #c9cdd3';
    }
  }
  
  return overlay;
}

async function captureSheetForPDF(sheet) {
  // Store original elements and their states
  const originalStates = [];
  
  // Hide interactive elements
  const controls = sheet.querySelectorAll('.row-del, .table-actions, .sig-controls button');
  controls.forEach(el => {
    originalStates.push({ element: el, display: el.style.display });
    el.style.display = 'none';
  });
  
  // Hide date icons
  const dateIcons = sheet.querySelectorAll('.date-icon');
  dateIcons.forEach(el => {
    originalStates.push({ element: el, display: el.style.display });
    el.style.display = 'none';
  });
  
  // Make sure parent containers have position:relative for absolute positioning
  const allParents = new Set();
  const elements = sheet.querySelectorAll('input, select');
  elements.forEach(el => {
    const parent = el.parentElement;
    if (!allParents.has(parent)) {
      allParents.add(parent);
      const pos = window.getComputedStyle(parent).position;
      if (pos === 'static') {
        originalStates.push({ element: parent, position: parent.style.position });
        parent.style.position = 'relative';
      }
    }
  });
  
  // Create overlays for all inputs and selects
  const overlays = [];
  
  elements.forEach(el => {
    // Skip hidden or non-visible elements
    if (el.offsetWidth === 0 || el.offsetHeight === 0) return;
    
    // Skip the native date input (it's hidden)
    if (el.classList.contains('date-native')) return;
    
    // For date display, only create overlay if it has a value
    if (el.classList.contains('date-display') && !el.value) return;
    
    // For regular inputs, only create overlay if they have a value
    if (el.tagName === 'INPUT' && !el.classList.contains('date-display') && !el.value) return;
    
    // For selects, create overlay if they have a selection
    if (el.tagName === 'SELECT' && !el.value) return;
    
    // Create the overlay
    const overlay = createPDFOverlay(el);
    
    // Store original visibility
    originalStates.push({ element: el, visibility: el.style.visibility });
    el.style.visibility = 'hidden';
    
    // Add overlay to parent
    el.parentElement.appendChild(overlay);
    overlays.push(overlay);
  });
  
  // Wait for DOM to update
  await new Promise(resolve => setTimeout(resolve, 50));
  
  // Capture with html2canvas
  const canvas = await html2canvas(sheet, {
    scale: 2,
    backgroundColor: '#ffffff',
    useCORS: true,
    logging: false,
    width: sheet.scrollWidth,
    height: sheet.scrollHeight,
    windowWidth: sheet.scrollWidth,
    windowHeight: sheet.scrollHeight
  });
  
  // Clean up overlays
  overlays.forEach(overlay => overlay.remove());
  
  // Restore original states
  originalStates.forEach(({ element, display, visibility, position }) => {
    if (display !== undefined) element.style.display = display;
    if (visibility !== undefined) element.style.visibility = visibility;
    if (position !== undefined) element.style.position = position;
  });
  
  return canvas;
}

document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('exportBtn');
  const origText = btn.textContent;
  btn.textContent = '⏳ Generating PDF...';
  btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'letter');
    const sheets = [...document.querySelectorAll('.sheet')];

    for (let i = 0; i < sheets.length; i++) {
      const canvas = await captureSheetForPDF(sheets[i]);
      
      const imgData = canvas.toDataURL('image/png');
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      
      // Calculate dimensions to fit the page with margins
      const margin = 40;
      const maxW = pageW - (margin * 2);
      const maxH = pageH - (margin * 2);
      
      const ratio = Math.min(maxW / canvas.width, maxH / canvas.height);
      const w = canvas.width * ratio;
      const h = canvas.height * ratio;
      
      if (i > 0) pdf.addPage();
      pdf.addImage(imgData, 'PNG', (pageW - w) / 2, margin, w, h);
    }

    pdf.save('Secondary_Employment_Report.pdf');
    alert('✅ PDF exported successfully!');
  } catch (error) {
    console.error('PDF export error:', error);
    alert('❌ Failed to export PDF: ' + error.message);
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
});
